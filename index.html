```html
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi sala de reacción</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0e0e10;
      color: #efeff1;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 18px 24px;
      background: #18181b;
      border-bottom: 1px solid #303035;
      color: #bf94ff;
      font-size: 22px;
      font-weight: bold;
    }

    main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 16px;
      padding: 20px;
    }

    .panel {
      background: #18181b;
      border-radius: 10px;
      overflow: hidden;
    }

    .heading {
      padding: 14px;
      font-weight: bold;
      border-bottom: 1px solid #303035;
    }

    .player {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .description {
      padding: 16px;
      color: #adadb8;
    }

    .chat {
      min-height: 400px;
    }

    .chat-player {
      height: 600px;
    }

    @media (max-width: 800px) {
      main {
        grid-template-columns: 1fr;
        padding: 10px;
      }

      .chat {
        min-height: 350px;
      }

      .chat-player {
        height: 450px;
      }
    }
  </style>
</head>

<body>
  <header>Mi sala de reacción</header>

  <main>
    <section class="panel">
      <div class="heading">Mi canal de Twitch</div>

      <div class="player">
        <iframe
          src="https://player.twitch.tv/?channel=fernandororonoa&parent=mi-reproductor-lyart.vercel.app"
          title="Mi transmisión de Twitch"
          allowfullscreen>
        </iframe>
      </div>

      <div class="description">
        Bienvenido a mi sala de reacción.
      </div>
    </section>

    <section class="panel chat">
      <div class="heading">Chat de Twitch</div>

      <div class="chat-player">
        <iframe
          src="https://www.twitch.tv/embed/fernandororonoa/chat?parent=mi-reproductor-lyart.vercel.app&darkpopout"
          title="Chat de Twitch">
        </iframe>
      </div>
    </section>
  </main>
</body>
</html>
```
